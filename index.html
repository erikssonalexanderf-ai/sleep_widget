// ========================================================
// CREATE CHART
// ========================================================

let sleepChart;


function createChart(days) {{

    const sleepData = allSleepData.slice(-days);


    const labels = sleepData.map(
        entry => entry.date
    );


    // ----------------------------------------------------
    // TOTAL SLEEP
    // ----------------------------------------------------

    const totalSleep = sleepData.map(
        entry => {

            if (
                entry.sleep_seconds === null ||
                entry.sleep_seconds === undefined
            ) {{
                return null;
            }}

            return entry.sleep_seconds / 3600;
        }}
    );


    // ----------------------------------------------------
    // SLEEP NEED
    // ----------------------------------------------------

    const sleepNeed = sleepData.map(
        entry => {

            if (
                entry.sleep_need_seconds === null ||
                entry.sleep_need_seconds === undefined
            ) {{
                return null;
            }}

            return entry.sleep_need_seconds / 3600;
        }}
    );


    // ----------------------------------------------------
    // DESTROY OLD CHART
    // ----------------------------------------------------

    if (sleepChart) {{
        sleepChart.destroy();
    }}


    // ----------------------------------------------------
    // CREATE NEW CHART
    // ----------------------------------------------------

    const ctx = document.getElementById(
        "sleepChart"
    );


    sleepChart = new Chart(ctx, {{

        type: "line",

        data: {{

            labels: labels,

            datasets: [

                // ----------------------------------------
                // TOTAL SLEEP
                // ----------------------------------------

                {{
                    label: "Total Sleep",

                    data: totalSleep,

                    borderWidth: 3,

                    pointRadius: 3,

                    tension: 0.2,

                    spanGaps: true
                }},


                // ----------------------------------------
                // SLEEP NEED
                // ----------------------------------------

                {{
                    label: "Sleep Need",

                    data: sleepNeed,

                    borderWidth: 2,

                    pointRadius: 2,

                    borderDash: [6, 6],

                    tension: 0.2,

                    spanGaps: true
                }}

            ]

        }},


        options: {{

            responsive: true,

            maintainAspectRatio: false,


            interaction: {{

                mode: "index",

                intersect: false

            }},


            plugins: {{

                legend: {{

                    display: true,

                    labels: {{

                        color: "orange"

                    }}

                }},


                tooltip: {{

                    callbacks: {{

                        label: function(context) {{

                            if (
                                context.raw === null ||
                                context.raw === undefined
                            ) {{
                                return context.dataset.label + ": No data";
                            }}

                            return (
                                context.dataset.label +
                                ": " +
                                context.raw.toFixed(1) +
                                " hours"
                            );

                        }}

                    }}

                }}

            }},


            scales: {{

                x: {{

                    ticks: {{

                        color: "orange",

                        maxTicksLimit: 8,

                        callback: function(value) {{

                            const date = new Date(

                                this.getLabelForValue(value)

                            );

                            return date.toLocaleDateString(

                                "en-US",

                                {{

                                    month: "short",

                                    day: "numeric"

                                }}

                            );

                        }}

                    }},


                    title: {{

                        display: true,

                        text: "Date",

                        color: "orange"

                    }},


                    grid: {{

                        color:
                            "rgba(255, 165, 0, 0.2)"

                    }}

                }},


                y: {{

                    min: 0,

                    max: 12,


                    ticks: {{

                        color: "orange",

                        callback: function(value) {{

                            return value + "h";

                        }}

                    }},


                    title: {{

                        display: true,

                        text: "Sleep (hours)",

                        color: "orange"

                    }},


                    grid: {{

                        color:
                            "rgba(255, 165, 0, 0.2)"

                    }}

                }}

            }}

        }}

    }});

}}


// ========================================================
// RANGE SELECTOR
// ========================================================

document
    .getElementById("rangeSelect")
    .addEventListener("change", function() {{

        const days = parseInt(
            this.value
        );

        createChart(days);

    }});


// ========================================================
// INITIAL CHART
// ========================================================

createChart(56);

</script>
