// ========================================================
// CREATE CHART
// ========================================================

let sleepChart;


function createChart(days) {

    const sleepData = allSleepData.slice(-days);

    const labels = sleepData.map(
        entry => entry.date
    );


    // ----------------------------------------------------
    // SLEEP STAGES
    // ----------------------------------------------------

    const deepSleep = sleepData.map(
        entry => {

            if (
                entry.deep_seconds === null ||
                entry.deep_seconds === undefined
            ) {
                return null;
            }

            return entry.deep_seconds / 3600;
        }
    );


    const lightSleep = sleepData.map(
        entry => {

            if (
                entry.light_seconds === null ||
                entry.light_seconds === undefined
            ) {
                return null;
            }

            return entry.light_seconds / 3600;
        }
    );


    const remSleep = sleepData.map(
        entry => {

            if (
                entry.rem_seconds === null ||
                entry.rem_seconds === undefined
            ) {
                return null;
            }

            return entry.rem_seconds / 3600;
        }
    );


    const awakeSleep = sleepData.map(
        entry => {

            if (
                entry.awake_seconds === null ||
                entry.awake_seconds === undefined
            ) {
                return null;
            }

            return entry.awake_seconds / 3600;
        }
    );


    // ----------------------------------------------------
    // DESTROY OLD CHART
    // ----------------------------------------------------

    if (sleepChart) {
        sleepChart.destroy();
    }


    // ----------------------------------------------------
    // CREATE CHART
    // ----------------------------------------------------

    const ctx = document.getElementById(
        "sleepChart"
    );


    sleepChart = new Chart(ctx, {

        type: "bar",

        data: {

            labels: labels,

            datasets: [

                {
                    label: "Deep Sleep",

                    data: deepSleep,

                    backgroundColor: "#4169E1",

                    borderWidth: 0
                },


                {
                    label: "Light Sleep",

                    data: lightSleep,

                    backgroundColor: "#87CEEB",

                    borderWidth: 0
                },


                {
                    label: "REM Sleep",

                    data: remSleep,

                    backgroundColor: "#9370DB",

                    borderWidth: 0
                },


                {
                    label: "Awake",

                    data: awakeSleep,

                    backgroundColor: "#FF8C00",

                    borderWidth: 0
                }

            ]

        },


        options: {

            responsive: true,

            maintainAspectRatio: false,


            interaction: {

                mode: "index",

                intersect: false

            },


            plugins: {

                legend: {

                    display: true,

                    labels: {

                        color: "orange"

                    }

                },


                tooltip: {

                    callbacks: {

                        label: function(context) {

                            if (
                                context.raw === null ||
                                context.raw === undefined
                            ) {
                                return context.dataset.label + ": No data";
                            }

                            return (
                                context.dataset.label +
                                ": " +
                                context.raw.toFixed(1) +
                                " hours"
                            );

                        }

                    }

                }

            },


            scales: {

                x: {

                    stacked: true,

                    ticks: {

                        color: "orange",

                        maxTicksLimit: 8,

                        callback: function(value) {

                            const date = new Date(
                                this.getLabelForValue(value)
                            );

                            return date.toLocaleDateString(
                                "en-US",
                                {
                                    month: "short",
                                    day: "numeric"
                                }
                            );

                        }

                    },

                    title: {

                        display: true,

                        text: "Date",

                        color: "orange"

                    },

                    grid: {

                        color:
                            "rgba(255, 165, 0, 0.2)"

                    }

                },


                y: {

                    stacked: true,

                    min: 0,

                    max: 12,

                    ticks: {

                        color: "orange",

                        callback: function(value) {

                            return value + "h";

                        }

                    },

                    title: {

                        display: true,

                        text: "Sleep (hours)",

                        color: "orange"

                    },

                    grid: {

                        color:
                            "rgba(255, 165, 0, 0.2)"

                    }

                }

            }

        }

    });

}


// ========================================================
// RANGE SELECTOR
// ========================================================

document
    .getElementById("rangeSelect")
    .addEventListener("change", function() {

        const days = parseInt(
            this.value
        );

        createChart(days);

    });


// ========================================================
// INITIAL CHART
// ========================================================

createChart(365);

</script>
